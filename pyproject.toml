[tool.poetry]
name = "ragacademic"
version = "0.0.0"
description = "RAG Academic project"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
package-mode = false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

# Kelima modul ini menyimpan teks prompt di dalam string tiga-kutip. Baris
# panjangnya adalah ISI yang dibaca model, bukan kode: membungkusnya berarti
# menyisipkan baris baru ke tengah kalimat prompt yang sudah disetel, dan
# `# noqa` tidak bisa dipakai karena akan ikut terbaca sebagai teks prompt.
[tool.ruff.lint.per-file-ignores]
"src/generation/prompt_templates.py" = ["E501"]
"src/generation/prompts.py" = ["E501"]
"src/indexing/concepts.py" = ["E501"]
"src/indexing/questions.py" = ["E501"]
"src/indexing/summarizer.py" = ["E501"]
