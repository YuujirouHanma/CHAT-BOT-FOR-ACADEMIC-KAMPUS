services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: classroom-rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: .
    container_name: ragacademic-backend
    depends_on:
      qdrant:
        condition: service_healthy
    # API key & GENERATION_* dibaca dari .env; QDRANT_* di bawah menimpanya
    # agar backend SELALU pakai Qdrant server (bukan local mode) di Docker.
    env_file: .env
    environment:
      QDRANT_MODE: server
      QDRANT_HOST: qdrant     # nama service qdrant di jaringan compose
      QDRANT_PORT: 6333       # port REST qdrant
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage   # materi yang diupload tetap ada walau container di-rebuild
      - ./data:/app/data         # log HITL & upload sementara
    restart: unless-stopped

volumes:
  qdrant_storage:
    driver: local